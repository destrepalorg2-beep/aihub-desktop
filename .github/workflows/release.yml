name: Build desktop app

# Push a tag like "v1.0.1" to trigger a build for both Windows and macOS,
# published together as one GitHub Release. You can also run it manually
# from the Actions tab (Run workflow) for a test build without a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm run build
          - os: macos-latest
            build_cmd: npm run build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: ${{ matrix.build_cmd }}

      - name: Upload build artifact (for manual/workflow_dispatch runs)
        uses: actions/upload-artifact@v4
        with:
          name: aihub-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
