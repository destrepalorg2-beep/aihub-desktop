<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ollama AI Desktop</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── App window ──────────────────────────────────────── */
    html, body { width: 420px; height: 680px; overflow: hidden; }

    body {
      background: radial-gradient(ellipse at 50% 0%, rgba(10, 132, 255, 0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 100%, rgba(191, 90, 242, 0.06) 0%, transparent 50%),
                  #08080f;
    }

    .app-window {
      width: 420px;
      height: 680px;
      display: flex;
      flex-direction: column;
      background: rgba(10, 10, 20, 0.85);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      overflow: hidden;
    }

    /* ── Titlebar ─────────────────────────────────────────── */
    .titlebar { 
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .titlebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    /* ── Content ──────────────────────────────────────────── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Hero card ────────────────────────────────────────── */
    .hero-card {
      padding: 24px 20px;
      text-align: center;
      border-radius: var(--radius-xl);
      position: relative;
    }

    .hero-card .glow-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% -20%, rgba(10,132,255,0.12) 0%, transparent 70%);
      border-radius: inherit;
      pointer-events: none;
    }

    .status-label {
      margin-top: 16px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .status-label.online { color: var(--accent-green); }
    .status-label.offline { color: var(--accent-red); }

    .status-sublabel {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }

    /* ── Network Card ──────────────────────────────────────── */
    .network-card { padding: 16px 20px; }

    .ip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .qr-mini {
      width: 44px;
      height: 44px;
      background: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s var(--spring);
    }

    .qr-mini:hover { transform: scale(1.05); }

    /* ── Stats grid ───────────────────────────────────────── */
    .stats-card { padding: 16px 20px; }

    /* ── Ollama status ────────────────────────────────────── */
    .ollama-card { padding: 14px 20px; }

    .ollama-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ollama-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .model-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .model-label {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* ── Actions footer ───────────────────────────────────── */
    .actions-bar {
      padding: 12px 20px;
      display: flex;
      gap: 8px;
      background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .uptime-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
<div class="app-window">

  <!-- ── Titlebar ────────────────────────────────────────── -->
  <div class="titlebar">
    <div class="titlebar-logo">
      <div class="logo-icon">🤖</div>
      <span class="titlebar-title">Ollama AI Desktop</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn minimize" onclick="minimize()" data-tooltip="Свернуть">—</button>
      <button class="titlebar-btn close" onclick="closeWindow()" data-tooltip="В трей">✕</button>
    </div>
  </div>

  <!-- ── Content ─────────────────────────────────────────── -->
  <div class="content">

    <!-- Hero Card -->
    <div class="glass hero-card animate-in">
      <div class="glow-bg"></div>
      <div class="status-ring" id="statusRing">
        <span class="icon" id="statusIcon">⚡</span>
      </div>
      <div class="status-label" id="statusLabel">Проверка...</div>
      <div class="status-sublabel" id="statusSublabel">Подключение к серверу</div>
      <div class="hero-actions">
        <button class="btn btn-primary" id="toggleBtn" onclick="toggleServer()" style="min-width:140px">
          <span id="toggleBtnIcon">⏳</span>
          <span id="toggleBtnText">Загрузка...</span>
        </button>
        <button class="btn btn-glass" onclick="openAdmin()" data-tooltip="Admin Panel">
          🛠
        </button>
      </div>
    </div>

    <!-- Network Card -->
    <div class="glass network-card animate-in">
      <div class="section-title">Сетевые данные</div>
      <div class="ip-row">
        <div>
          <div class="metric-label">IP Адрес</div>
          <div class="ip-display" id="ipAddress">—</div>
        </div>
        <div>
          <div class="metric-label">Порт</div>
          <div class="ip-display" id="serverPort">3000</div>
        </div>
        <div class="qr-mini" onclick="showQR()" data-tooltip="Показать QR">📱</div>
      </div>
      <div class="info-row" style="padding-top:8px">
        <span class="info-label">Полный адрес</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="info-value" id="fullAddress" style="font-size:12px;color:var(--text-tertiary)">—</span>
          <button class="copy-btn" onclick="copyAddress()" data-tooltip="Копировать">⎘</button>
        </div>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="glass stats-card animate-in">
      <div class="section-title">Статистика</div>
      <div class="metric-grid">
        <div class="metric-card">
          <div class="metric-label">Подключений</div>
          <div class="metric-value blue counter" id="connections">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Запросов</div>
          <div class="metric-value purple counter" id="requests">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Ошибок</div>
          <div class="metric-value orange counter" id="errors">0</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Ср. задержка</div>
          <div class="metric-value green" id="latency">—</div>
        </div>
      </div>
    </div>

    <!-- Ollama Status -->
    <div class="glass ollama-card animate-in">
      <div class="ollama-row">
        <div class="ollama-info">
          <div style="font-size:24px">🦙</div>
          <div>
            <div class="model-name" id="modelName">Ollama</div>
            <div class="model-label" id="modelLabel">Проверка...</div>
          </div>
        </div>
        <div id="ollamaStatus" class="badge badge-orange">⏳ Проверка</div>
      </div>
    </div>

  </div>

  <!-- ── Actions Bar ──────────────────────────────────────── -->
  <div class="actions-bar">
    <div class="uptime-badge">
      ⏱ <span id="uptime">00:00:00</span>
    </div>
    <div style="flex:1"></div>
    <button class="btn btn-glass" style="padding:8px 14px;font-size:12px" onclick="openSettings()">
      ⚙️ Настройки
    </button>
    <button class="btn btn-glass" style="padding:8px 14px;font-size:12px" onclick="openAdmin()">
      🛠 Admin
    </button>
  </div>

</div>

<script src="main-renderer.js"></script>
</body>
</html>
